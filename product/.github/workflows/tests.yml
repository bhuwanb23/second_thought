name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: No third-party packages, by design
        run: python -c "import tomllib,sys; d=tomllib.load(open('pyproject.toml','rb')); deps=d['project'].get('dependencies',[]); print('deps:',deps); sys.exit(1 if deps else 0)"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Five PayPal calls on a fake transport (no credentials needed)
        run: python demo.py --dry-run
      - name: Security checks (22)
        run: bash scripts/v5_two_jars.sh
      - name: Deploy preconditions (17)
        run: python scripts/preflight_deploy.py

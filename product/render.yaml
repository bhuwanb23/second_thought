# render.yaml — the deploy, declared.
#
# `free` is the current deployment choice. It sleeps after 15 minutes idle, so
# the public URL is suitable for review after a wake-up but does not satisfy an
# always-on judging guarantee. Upgrade to `starter` before submission if possible.
#
# No secret is written here. Every credential is `sync: false`, which means "ask
# me in the dashboard", and the two shared secrets are generated by Render so
# nobody has to invent them.

services:
  - type: web
    name: second-thought
    runtime: python
    plan: free
    region: oregon
    numInstances: 1                 # one instance: session state is in memory, on purpose
    buildCommand: pip install .
    startCommand: python3 scripts/make_proof.py --quiet && python3 scripts/serve.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # --- PayPal sandbox (V0.1) ---------------------------------------
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENV
        value: sandbox              # `live` is refused by the gateway at runtime
      # --- the model (V0.3) --------------------------------------------
      - key: LLM_API_KEY
        sync: false                 # unset means the badge reads AI · LLM-MOCK
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_DAILY_CALL_BUDGET
        value: "1500"
      # --- generated, never typed by a human ---------------------------
      - key: APPROVAL_SECRET
        generateValue: true
      - key: DIAG_TOKEN
        generateValue: true         # keeps /diagnostics closed on the public URL
      # --- runtime ------------------------------------------------------
      - key: ST_ENV
        value: production
      - key: ST_DB_PATH
        value: /tmp/secondthought.sqlite3   # ephemeral is correct: personas are seeded
      - key: RENDER_API_KEY
        sync: false                 # only read by scripts/v0_check.py, to prove the plan

# render.yaml — the deploy, declared.
#
# `starter`, not `free`. A free instance sleeps after 15 minutes idle, and a judge
# arriving cold would wait through a spin-up inside a three-minute review window.
# Paying $7 to not lose points on Presentation is the cheapest decision in this
# project.
#
# No secret is written here. Every credential is `sync: false`, which means "ask
# me in the dashboard", and the two shared secrets are generated by Render so
# nobody has to invent them.

services:
  - type: web
    name: second-thought
    runtime: python
    rootDir: product
    plan: starter
    region: oregon
    numInstances: 1                 # one instance: session state is in memory, on purpose
    buildCommand: pip install .
    startCommand: python3 scripts/serve.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # --- PayPal sandbox (V0.1) ---------------------------------------
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENV
        value: sandbox              # `live` is refused by the gateway at runtime
      # --- the model (V0.3) --------------------------------------------
      - key: LLM_API_KEY
        sync: false                 # unset means the badge reads AI · LLM-MOCK
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_DAILY_CALL_BUDGET
        value: "1500"
      # --- generated, never typed by a human ---------------------------
      - key: APPROVAL_SECRET
        generateValue: true
      - key: DIAG_TOKEN
        generateValue: true         # keeps /diagnostics closed on the public URL
      # --- runtime ------------------------------------------------------
      - key: ST_ENV
        value: production
      - key: ST_DB_PATH
        value: /tmp/secondthought.sqlite3   # ephemeral is correct: personas are seeded
      - key: RENDER_API_KEY
        sync: false                 # only read by scripts/v0_check.py, to prove the plan

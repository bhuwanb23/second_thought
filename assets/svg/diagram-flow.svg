<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><rect x="0" y="0" width="1400" height="700" fill="#f6f7f9"/><text x="64" y="66" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#5b6472" text-anchor="start" letter-spacing="0.14em">THE DECISION</text><text x="64" y="112" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#14181f" text-anchor="start" letter-spacing="-0.02em">One extra question at the moment of the split</text><rect x="64" y="210" width="320" height="110" fill="#ffffff" rx="14" stroke="#dfe3e9" stroke-width="1.5"/><text x="82" y="242.25" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#14181f" text-anchor="start">The shopper's month</text><text x="82" y="265.25" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">paydays, rent, the car loan — as</text><text x="82" y="286.25" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">of today</text><rect x="64" y="340" width="320" height="110" fill="#ffffff" rx="14" stroke="#dfe3e9" stroke-width="1.5"/><text x="82" y="372.25" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#14181f" text-anchor="start">This purchase</text><text x="82" y="395.25" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">$249.00 at Northwind Audio</text><line x1="386" y1="265" x2="466" y2="300" stroke="#5b6472" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="386" y1="395" x2="466" y2="348" stroke="#5b6472" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="470" y="200" width="310" height="250" fill="#ffffff" rx="14" stroke="#dfe3e9" stroke-width="1.5"/><text x="492" y="238" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#14181f" text-anchor="start">45-day projection</text><text x="492" y="266" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">Every payday against every bill,</text><text x="492" y="287" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">day by day.</text><path d="M 492,388 L 520,362 L 548,376 L 576,340 L 604,356 L 632,316 L 660,344 L 688,396 L 716,366 L 752,380" fill="none" stroke="#5b6472" stroke-width="2.2"/><line x1="492" y1="372" x2="752" y2="372" stroke="#8c2f39" stroke-width="1.6" stroke-dasharray="5 5"/><text x="492" y="428" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#8c2f39" text-anchor="start">floor</text><line x1="782" y1="322" x2="858" y2="322" stroke="#5b6472" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="860" y="246" width="252" height="152" fill="#ffffff" rx="14" stroke="#dfe3e9" stroke-width="1.5"/><text x="882" y="284" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#14181f" text-anchor="start">The floor test</text><text x="882" y="312" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">max(10% of monthly</text><text x="882" y="333" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-ancho
rl(#arrow)"/><rect x="1148" y="496" width="188" height="96" fill="#ffffff" rx="12" stroke="#dfe3e9" stroke-width="1.5"/><rect x="1148" y="496" width="5" height="96" fill="#8c2f39" rx="2"/><text x="1166" y="530" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#8c2f39" text-anchor="start" letter-spacing="0.06em">DECLINE</text><text x="1166" y="554" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6472" text-anchor="start">not this month, and</text><text x="1166" y="571" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6472" text-anchor="start">here is why</text><text x="64" y="664" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">Everything after the floor test is arithmetic. No model decides anything here.</text></svg>
6472" text-anchor="start">it, PayPal invoices you on payday — and the merchant</text><text x="84" y="558" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5b6472" text-anchor="start">ships when you've paid.</text><rect x="760" y="214" width="356" height="66" fill="#ffffff" rx="12" stroke="#dfe3e9" stroke-width="1.5"/><rect x="760" y="214" width="5" height="66" fill="#0f7b4f" rx="2"/><text x="784" y="244" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f7b4f" text-anchor="start" letter-spacing="0.04em">OFFER</text><text x="784" y="266" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">pay in four today</text><rect x="760" y="300" width="356" height="66" fill="#ffffff" rx="12" stroke="#dfe3e9" stroke-width="1.5"/><rect x="760" y="300" width="5" height="66" fill="#8a5a00" rx="2"/><text x="784" y="330" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#8a5a00" text-anchor="start" letter-spacing="0.04em">DEFER</text><text x="784" y="352" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">pay on payday, ship on payment</text><rect x="760" y="386" width="356" height="66" fill="#ffffff" rx="12" stroke="#dfe3e9" stroke-width="1.5"/><rect x="760" y="386" width="5" height="66" fill="#8c2f39" rx="2"/><text x="784" y="416" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#8c2f39" text-anchor="start" letter-spacing="0.04em">DECLINE</text><text x="784" y="438" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">here's what would fit</text><text x="84" 
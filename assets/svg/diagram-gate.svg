<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><rect x="0" y="0" width="1400" height="600" fill="#f6f7f9"/><text x="64" y="66" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#5b6472" text-anchor="start" letter-spacing="0.14em">THE GATE</text><text x="64" y="112" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#14181f" text-anchor="start" letter-spacing="-0.02em">A tampered approval cannot move money</text><rect x="64" y="176" width="300" height="170" fill="#ffffff" rx="14" stroke="#dfe3e9" stroke-width="1.5"/><text x="82" y="207.5" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#14181f" text-anchor="start">1 · A plan is proposed</text><text x="82" y="230.5" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">the engine decides, the app</text><text x="82" y="251.5" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">builds the exact arguments</text><line x1="368" y1="261" x2="416" y2="261" stroke="#5b6472" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="420" y="176" width="330" height="170" fill="#ffffff" rx="14" stroke="#dfe3e9" stroke-width="1.5"/><text x="438" y="207.5" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#14181f" text-anchor="start">2 · A single-use token</text><text x="438" y="230.5" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">HMAC over the tool name and every</text><text x="438" y="251.5" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">argument · short TTL · one</text><text x="438" y="272.5" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">redemption</text><line x1="754" y1="261" x2="802" y2="261" stroke="#5b6472" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="806" y="176" width="300" height="170" fill="#ffffff" rx="14" stroke="#dfe3e9" stroke-width="1.5"/><text x="824" y="207.5" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#14181f" text-anchor="start">3 · A human redeems it</text><text x="824" y="230.5" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">nothing reaches PayPal until</text><text x="824" y="251.5" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="start">this happens</text><line x1="1110" y1="261" x2="1158" y2="261" stroke="#5b6472" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1160" y="206" width="176" height="110" fill="#ffffff" rx="12" stroke="#dfe3e9" stroke-width="1.5"/><text x="1180" y="246" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#14181f" text-anchor="start">PayPal</text><text x="1180" y="274" font-family="DejaVu Sans, Verdana, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start">sandbox call</text><text x="64" y="402" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#5b6472" text-anchor="start" letter-spacing="0.08em">ALL 